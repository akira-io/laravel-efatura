name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions: {}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install git-cliff
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: git-cliff

      - name: Refuse a tag outside main
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::${TAG_NAME} points at ${GITHUB_SHA}, which is not contained in origin/main. Release tags are created on main only."
            exit 1
          fi

      - name: Refuse a tag that is already released
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${TAG_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "::error::A GitHub Release for ${TAG_NAME} already exists. Published releases are never replaced; tag the next version instead."
            exit 1
          fi

      - name: Verify tag matches the version computed from commits
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git tag -d "${TAG_NAME}" >/dev/null
          trap 'git tag "${TAG_NAME}" "${GITHUB_SHA}"' EXIT

          if [ -z "$(git tag -l)" ]; then
            echo "No prior tags found; skipping the bump check for this repository's first release."
            exit 0
          fi

          PREVIOUS="$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*' HEAD 2>/dev/null || true)"
          EXPECTED="$(git-cliff --config cliff.toml --use-branch-tags --bumped-version)"

          if [ -n "${PREVIOUS}" ] && [ "${EXPECTED}" = "${PREVIOUS}" ]; then
            IFS=. read -r MAJOR MINOR PATCH <<< "${PREVIOUS#v}"
            EXPECTED="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi

          if [ "${EXPECTED}" != "${TAG_NAME}" ]; then
            echo "::error::Tag ${TAG_NAME} does not match the version computed from the commits since ${PREVIOUS:-the last release} (${EXPECTED}). Delete the tag, re-tag as ${EXPECTED}, and push again: git tag -d ${TAG_NAME} && git push origin :refs/tags/${TAG_NAME} && git tag ${EXPECTED} && git push --follow-tags"
            exit 1
          fi

  gates:
    name: Test gates
    needs: verify
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yml

  release:
    name: Publish the release
    needs: [verify, gates]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: git-cliff

      - name: Generate CHANGELOG
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: git-cliff --config cliff.toml --use-branch-tags --tag "${TAG_NAME}" --output CHANGELOG.md

      - name: Extract release notes
        id: notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git-cliff --config cliff.toml --use-branch-tags --current --strip all > "${RUNNER_TEMP}/release-notes.md"
          if ! grep -q '[^[:space:]]' "${RUNNER_TEMP}/release-notes.md"; then
            echo "Maintenance release with no user-facing changes." > "${RUNNER_TEMP}/release-notes.md"
          fi
          DELIMITER="notes_$(openssl rand -hex 16)"
          {
            echo "body<<${DELIMITER}"
            cat "${RUNNER_TEMP}/release-notes.md"
            echo "${DELIMITER}"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve release flags
        id: flags
        run: |
          set -euo pipefail
          HIGHEST_ON_MAIN="$( { git tag --merged origin/main --list 'v[0-9]*' | grep -v -- '-' || true; echo "${TAG_NAME}"; } | sort -V | tail -n1)"
          HIGHEST_STABLE="$( { git tag --list 'v[0-9]*' | grep -v -- '-' || true; echo "${TAG_NAME}"; } | sort -V | tail -n1)"

          NEWEST=false
          if [ "${HIGHEST_ON_MAIN}" = "${TAG_NAME}" ]; then
            NEWEST=true
          fi

          PRERELEASE=false
          LATEST=false
          case "${TAG_NAME}" in
            *-*) PRERELEASE=true ;;
            *)
              if [ "${HIGHEST_STABLE}" = "${TAG_NAME}" ]; then
                LATEST=true
              fi
              ;;
          esac

          echo "Newest on main: ${NEWEST}; latest: ${LATEST}; prerelease: ${PRERELEASE}"
          {
            echo "newest=${NEWEST}"
            echo "latest=${LATEST}"
            echo "prerelease=${PRERELEASE}"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.flags.outputs.latest }}
          PRERELEASE: ${{ steps.flags.outputs.prerelease }}
        run: |
          gh release create "${TAG_NAME}" \
            --title "${TAG_NAME}" \
            --notes-file "${RUNNER_TEMP}/release-notes.md" \
            --latest="${LATEST}" \
            --prerelease="${PRERELEASE}"

      - name: Send GitHub Release to Discord
        uses: SethCohen/github-releases-to-discord@24d166886aee4646d448c8a389ff9e1ebcab3682 # v1.20.0
        with:
          webhook_url: ${{ secrets.DISCORD }}
          release_name: ${{ github.ref_name }}
          release_body: ${{ steps.notes.outputs.body }}
          release_html_url: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
          color: "2105893"
          username: "Akira E-Fatura"
          avatar_url: "https://avatars.githubusercontent.com/u/116525492?s=96&v=4"
          content: "||@everyone||"
          footer_title: "Akira E-Fatura"
          footer_icon_url: "https://avatars.githubusercontent.com/u/116525492?s=96&v=4"
          footer_timestamp: true

      - name: Commit CHANGELOG
        env:
          NEWEST: ${{ steps.flags.outputs.newest }}
        run: |
          set -euo pipefail
          if [ "${NEWEST}" != true ]; then
            echo "::notice::main already carries a release newer than ${TAG_NAME}; CHANGELOG.md on main is left as is."
            exit 0
          fi

          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          mv CHANGELOG.md "${RUNNER_TEMP}/CHANGELOG.md"
          git checkout -f -B main origin/main
          cp "${RUNNER_TEMP}/CHANGELOG.md" CHANGELOG.md
          git add CHANGELOG.md
          git diff --cached --quiet || git commit -m "chore(changelog): ${TAG_NAME}"
          git push origin HEAD:refs/heads/main
